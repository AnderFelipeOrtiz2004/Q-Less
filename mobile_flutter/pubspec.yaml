name: q_less_prototype
description: Q-Less app prototype with login and register screens.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  url_launcher: ^6.1.10
  image_picker: ^0.8.7+5
  shared_preferences: ^2.0.15
  audioplayers: ^6.6.0
  google_generative_ai: ^0.4.0
  flutter_dotenv: ^5.1.0
  provider: ^6.0.0
  flutter_secure_storage: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/logo.png
    - assets/sounds/click.mp3
    - assets/sounds/success.mp3
