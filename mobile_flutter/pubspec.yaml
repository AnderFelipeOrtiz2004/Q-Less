name: q_less_prototype
description: Q-Less app prototype with login and register screens.
publish_to: none
version: 2.9.2+32
environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  url_launcher: ^6.1.10
  image_picker: ^0.8.7+5
  shared_preferences: ^2.0.15
  audioplayers: ^6.6.0
  flutter_dotenv: ^5.1.0
  provider: ^6.0.0
  flutter_secure_storage: ^8.0.0
  connectivity_plus: ^6.1.4
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/icon_ql.png
  adaptive_icon_background: "#76C11F"
  adaptive_icon_foreground: assets/images/icon_ql.png
  web:
    generate: true
    image_path: assets/images/icon_ql.png
    background_color: "#76C11F"
    theme_color: "#76C11F"

flutter_native_splash:
  color: "#76C11F"
  image: assets/images/icon_ql.png
  android_12:
    color: "#76C11F"
    image: assets/images/icon_ql.png
  web: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/logo.png
    - assets/images/icon_ql.png
    - assets/sounds/
